#!/usr/bin/env python

PACKAGE = "static_obstacle_detection"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()


gen.add("static_minPoints", int_t, 0, "static_minPoints", 1, 1, 100)
gen.add("static_epsilon", double_t, 0, "static_epsilon", 0.4, 0.0, 20.0)
gen.add("static_minClusterSize", int_t, 0, "static_minClusterSize", 5, 1, 100)
gen.add("static_maxClusterSize", int_t, 0, "static_maxClusterSize", 1000, 1, 10000)

gen.add("static_xMinROI", double_t, 0, "static_xMinROI", 0.5, 0, 10)
gen.add("static_xMaxROI", double_t, 0, "static_xMaxROI", 11.0, -10, 200)
gen.add("static_yMinROI", double_t, 0, "static_yMinROI", -2.5, -200, 10)
gen.add("static_yMaxROI", double_t, 0, "static_yMaxROI", 2.5, -10, 200)
gen.add("static_zMinROI", double_t, 0, "static_zMinROI", -1.0, -10, 0)
gen.add("static_zMaxROI", double_t, 0, "static_zMaxROI", 2.0, -2, 50)

gen.add("static_xMinBoundingBox", double_t, 0, "static_xMinBoundingBox", 0.1, 0, 100)
gen.add("static_xMaxBoundingBox", double_t, 0, "static_xMaxBoundingBox", 1.4, 0, 100)
gen.add("static_yMinBoundingBox", double_t, 0, "static_yMinBoundingBox", 0.2, 0, 100)
gen.add("static_yMaxBoundingBox", double_t, 0, "static_yMaxBoundingBox", 2.0, 0, 100)
gen.add("static_zMinBoundingBox", double_t, 0, "static_zMinBoundingBox", 0.3, -3, 100)
gen.add("static_zMaxBoundingBox", double_t, 0, "static_zMaxBoundingBox", 1.85, 0, 100)

exit(gen.generate(PACKAGE, "static_obstacle", "static_hyper_parameter"))




