gen.add("local_velocity", double_t, 0, "local_velocity", 5., 0., 20.)
gen.add("local_lookahead_distance", double_t, 0, "local_lookahead_distance", 2.0, 0., 50.)

exit(gen.generate(PACKAGE, "control_parameter", "CtrlParam"))
