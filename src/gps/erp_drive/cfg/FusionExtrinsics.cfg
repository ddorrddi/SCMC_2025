#!/usr/bin/env python
PACKAGE = "erp_drive"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# 위치 (m)
gen.add("x", double_t, 0, "Camera-to-LiDAR X (m)", 0.0, -2.0, 2.0)
gen.add("y", double_t, 0, "Camera-to-LiDAR Y (m)", 0.0, -2.0, 2.0)
gen.add("z", double_t, 0, "Camera-to-LiDAR Z (m)", 0.0, -2.0, 2.0)

# 자세 (deg) - UI는 degree가 편하니 degree로 받고 rad로 변환
gen.add("roll_deg",  double_t, 0, "Roll (deg)",  0.0, -180.0, 180.0)
gen.add("pitch_deg", double_t, 0, "Pitch (deg)", 0.0, -180.0, 180.0)
gen.add("yaw_deg",   double_t, 0, "Yaw (deg)",   0.0, -180.0, 180.0)

# (선택) 포인트 시각화 파라미터도 같이 조절하고 싶으면
gen.add("cloud_stride", int_t, 0, "Point cloud stride", 1, 1, 20)
gen.add("max_projected_points", int_t, 0, "Max projected points", 100000, 1000, 300000)

exit(gen.generate(PACKAGE, "erp_drive", "FusionExtrinsics"))
