#!/usr/bin/env python

PACKAGE = "erp_drive"
from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Camera position parameters
gen.add("cam_x", double_t, 0, "Camera X position in meters", 0.82, -5.0, 5.0)
gen.add("cam_y", double_t, 0, "Camera Y position in meters", 0.3, -5.0, 5.0)
gen.add("cam_z", double_t, 0, "Camera Z position in meters", 1.0, -5.0, 5.0)

# Camera orientation parameters (in degrees)
gen.add("cam_yaw", double_t, 0, "Camera Yaw angle in degrees", 45, -180, 180)
gen.add("cam_pitch", double_t, 0, "Camera Pitch angle in degrees", 0, -90, 90)
gen.add("cam_roll", double_t, 0, "Camera Roll angle in degrees", 0, -90, 90)

exit(gen.generate(PACKAGE, "erp_drive", "CaliReal"))
